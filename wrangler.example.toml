# Legacy Worker service name kept to avoid creating a new production Worker during rename cleanup.
name = "cfchat"
main = "worker/src/index.js"
compatibility_date = "2026-04-05"
compatibility_flags = ["nodejs_compat"]

[vars]
ADMIN_USERNAMES = "admin"
MESSAGE_RETENTION_DAYS = "7"
SOFT_DELETE_RETENTION_DAYS = "60"
GC_BATCH_SIZE = "500"
GC_MAX_BATCHES_PER_RUN = "20"
R2_DELETE_MAX_RETRY = "8"
ALLOWED_FILE_TYPES = "image/,video/,application/pdf,text/"
MAX_FILE_SIZE = "20971520"

[[d1_databases]]
binding = "DB"
# Legacy D1 resource name kept intentionally; do not rename without a data migration plan.
database_name = "cfchat-db"
database_id = "YOUR_D1_DATABASE_ID_HERE"

[[kv_namespaces]]
binding = "SESSIONS"
id = "YOUR_KV_NAMESPACE_ID_HERE"

[[r2_buckets]]
binding = "FILES"
# Legacy R2 bucket name kept intentionally; code/docs use Edgechat branding.
bucket_name = "cfchat-files"

[[durable_objects.bindings]]
name = "CHANNEL_ROOM"
class_name = "ChannelRoom"

[[durable_objects.bindings]]
name = "SCHEDULER"
class_name = "Scheduler"

[[durable_objects.bindings]]
name = "USER_INBOX"
class_name = "UserInbox"

[[durable_objects.bindings]]
name = "PRESENCE"
class_name = "Presence"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChannelRoom", "Scheduler"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["UserInbox"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Presence"]

[assets]
directory = "./frontend/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/files/*"]

[triggers]
# Cloudflare Cron 按 UTC 执行；19:00 UTC = 北京时间每天 03:00
crons = ["0 19 * * *"]

# Web Push (VAPID) 通过部署时注入的 secrets 配置(GitHub Actions 的
# VAPID_PUBLIC_KEY / VAPID_PRIVATE_KEY / VAPID_SUBJECT),无需写在此文件。
# 注意:VAPID_SUBJECT 必须是真实邮箱(mailto:you@your-domain.com)或网址(https://...),
# Apple 推送服务拒绝 @localhost/@example.com 等占位域名(返回 403 BadJwtToken),FCM 不查。
# 本地调试:  node .github/scripts/generate-vapid-keys.mjs

# 站点对外 URL,用于 Declarative Web Push 通知点击跳转(navigate 字段需绝对地址),
# 改成你自己的实际域名;不配则回退为相对路径,点击跳转可能失效。
# SITE_URL = "https://im.your-domain.com"
